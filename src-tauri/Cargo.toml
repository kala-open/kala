[package]
name = "kala"
version = "1.0.4"
description = "Open-source living desktop notch for macOS, Linux, and Windows"
authors = ["Kala Open Source Contributors"]
license = "MIT"
repository = "https://github.com/kala-open/kala"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kala_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2.2.0"
tauri-plugin-notification = "2.2.0"
tauri-plugin-autostart = "2.2.0"
tauri-plugin-clipboard-manager = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "5.0"
ureq = { version = "2.10", features = ["json"] }
sysinfo = "0.32"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Media_Control",
] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
